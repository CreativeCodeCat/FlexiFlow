[package]
name = "flexiflow-river"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "FlexiFlow's dwm-style window management for the river Wayland compositor"
license-file = "LICENSE"

[lib]
name = "flexiflow_river"
path = "src/lib.rs"

[[bin]]
name = "flexiflow-river"
path = "src/bin/flexiflow-river/main.rs"

[[bin]]
name = "flexiflow-river-bar"
path = "src/bin/flexiflow-river-bar/main.rs"

[[bin]]
name = "flexiflow-river-hotkeys"
path = "src/bin/flexiflow-river-hotkeys/main.rs"

[[bin]]
name = "flexiflow-river-status"
path = "src/bin/flexiflow-river-status/main.rs"

[dependencies]
flexiflow-common = { path = "../flexiflow-common" }
bitflags = "2"
env_logger = "0.11.6"
fontdue = "0.9"
libc = "0.2.185"
log = "0.4.29"
png = "0.18"
resvg = "0.48"
mlua = { version = "0.11.6", features = ["lua54", "serialize"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["xkbcommon"] }
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
xkbcommon = { version = "0.8", default-features = false }
zbus = "5"

